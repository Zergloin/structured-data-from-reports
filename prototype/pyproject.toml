[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-components"
version = "0.1.0"
description = "Typed Strategy prototypes for structured report data"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["mypy>=1.10,<3", "types-jsonschema"]
docs = ["python-docx>=1.1,<2", "Pillow>=10", "PyMuPDF>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
files = ["src"]

